name: delete-releases

# Removes the given releases and their tags, for example a build that an antivirus flagged.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags to delete, separated by spaces"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          for t in $TAGS; do
            gh release delete "$t" -R "${{ github.repository }}" --yes --cleanup-tag && echo "deleted $t"
          done
